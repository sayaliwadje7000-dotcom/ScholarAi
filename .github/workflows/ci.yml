name: CI Pipeline

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  quality-checks:
    name: Python Quality Checks and Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: scholarai
          POSTGRES_PASSWORD: ci-test-password
          POSTGRES_DB: scholarai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scholarai -d scholarai_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PYTHONPATH: .
      PYTHONDONTWRITEBYTECODE: "1"
      SCHOLARAI_ENVIRONMENT: testing
      SCHOLARAI_DEBUG: "false"
      DATABASE_URL: postgresql+psycopg://scholarai:ci-test-password@127.0.0.1:5432/scholarai_test
      GEMINI_API_KEY: ""
      SCHOLARAI_JWT_SECRET_KEY: ci-only-not-for-production-secret-key-12345678901234567890

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr libgomp1

      - name: Install Python dependencies
        run: python -m pip install -r requirements-test.txt

      - name: Verify dependencies
        run: python -m pip check

      - name: Verify Python compilation
        run: |
          python - <<'PY'
          import compileall
          import pathlib
          import sys

          roots = [pathlib.Path("app"), pathlib.Path("tests")]
          failed = []

          for root in roots:
              for source in root.rglob("*.py"):
                  if "overwritten-backup" in source.name or source.name.endswith(".bak.py"):
                      continue
                  if not compileall.compile_file(str(source), quiet=1, force=True):
                      failed.append(str(source))

          if failed:
              print("Python compilation failed:")
              print("\n".join(failed))
              sys.exit(1)

          print("Python compilation successful.")
          PY

      - name: Verify Alembic migrations
        run: |
          python -m alembic heads
          python -m alembic history
          python -m alembic upgrade head

      - name: Run complete test suite
        run: python -m pytest -v --tb=short

  docker-validation:
    name: Production Docker Image Validation
    runs-on: ubuntu-latest
    needs: quality-checks

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build production Docker image
        run: docker build --pull -t scholarai-backend:ci .
