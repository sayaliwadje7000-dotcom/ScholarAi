name: ScholarAI Continuous Integration

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scholarai-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-checks:
    name: Python Quality Checks and Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: scholarai
          POSTGRES_PASSWORD: ci-test-password
          POSTGRES_DB: scholarai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scholarai -d scholarai_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PYTHONPATH: .
      PYTHONDONTWRITEBYTECODE: "1"
      SCHOLARAI_ENVIRONMENT: testing
      SCHOLARAI_DEBUG: "false"
      DATABASE_URL: postgresql+psycopg://scholarai:ci-test-password@127.0.0.1:5432/scholarai_test
      GEMINI_API_KEY: ""
      SCHOLARAI_JWT_SECRET_KEY: ci-only-not-for-production-secret-key-12345678901234567890

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng libgomp1

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt

      - name: Verify installed dependency consistency
        run: python -m pip check

      - name: Verify Python compilation
        run: python -m compileall -q app tests

      - name: Validate Alembic migration graph
        run: |
          python -m alembic heads
          python -m alembic history

      - name: Apply database migrations
        run: python -m alembic upgrade head

      - name: Run complete test suite
        run: python -m pytest -v --tb=short

      - name: Report quality-check completion
        if: success()
        run: echo "ScholarAI quality checks passed."

  docker-build:
    name: Production Docker Image Validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - quality-checks

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build production Docker image
        run: |
          docker build \
            --pull \
            --tag scholarai-backend:ci \
            .

      - name: Verify Docker image
        run: docker image inspect scholarai-backend:ci

      - name: Report Docker build completion
        if: success()
        run: echo "ScholarAI production Docker image built successfully."
